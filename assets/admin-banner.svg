<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lumervale Systems Admin</title>
  <desc id="desc">Official GitHub administrator. Clear systems. Better business.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031027"/>
      <stop offset="1" stop-color="#0c2850"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#49bec2" stroke-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1060" cy="-30" r="230" fill="#49bec2" opacity="0.08"/>
  <circle cx="1150" cy="390" r="250" fill="#d9b45f" opacity="0.06"/>

  <g transform="translate(86 62)" filter="url(#shadow)">
    <circle cx="118" cy="118" r="112" fill="#071a36" stroke="#49bec2" stroke-opacity="0.38" stroke-width="2"/>
    <circle cx="118" cy="118" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M67 64v109h74" fill="none" stroke="#f7f8f6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M146 67c-37-12-65 4-65 28 0 42 86 25 86 68 0 28-35 42-73 25" fill="none" stroke="#f7f8f6" stroke-width="24" stroke-linecap="round"/>
    <path d="M88 89c10-14 25-22 42-23" fill="none" stroke="#49bec2" stroke-width="12" stroke-linecap="round"/>
    <path d="M139 177c10-5 18-12 23-22" fill="none" stroke="#d9b45f" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(370 90)">
    <text x="0" y="35" fill="#49bec2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="5">OFFICIAL GITHUB ADMINISTRATOR</text>
    <text x="0" y="102" fill="#f7f8f6" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-2">Lumervale Systems Admin</text>
    <line x1="0" y1="135" x2="710" y2="135" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="0" y="182" fill="#d9b45f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Clear systems. Better business.</text>
  </g>

  <g transform="translate(1080 175)">
    <circle cx="0" cy="0" r="6" fill="#49bec2"/>
    <circle cx="28" cy="0" r="6" fill="#d9b45f"/>
    <circle cx="56" cy="0" r="6" fill="#f7f8f6"/>
  </g>
